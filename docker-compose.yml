services:
  postgres:
    image: postgres:16-alpine
    container_name: kampos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kampos
      POSTGRES_PASSWORD: kampos_dev_password
      POSTGRES_DB: kampos
    ports:
      # Host port 5433, not 5432 — this machine already has a native
      # Windows Postgres service bound to 5432 (a real Windows Service,
      # unrelated to this project) — mapping onto the same host port would
      # silently collide with it instead of reaching this container.
      - "5433:5432"
    volumes:
      - kampos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kampos -d kampos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kampos_postgres_data:
