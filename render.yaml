services:
  - type: web
    name: kampos-backend
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: |
      python manage.py migrate
      gunicorn kampos.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: kampos.settings
      - key: PYTHON_VERSION
        value: 3.11.0 