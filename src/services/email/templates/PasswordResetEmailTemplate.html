<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your password</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; background:#f7f7f9; margin:0; padding:0; }
      .container { max-width: 560px; margin: 24px auto; background: #ffffff; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.06); }
      .header { background: #161a30; color: #fff; padding: 20px 24px; font-weight: 600; font-size: 18px; }
      .content { padding: 24px; color: #333; }
      .code { display: inline-block; letter-spacing: 4px; font-size: 28px; font-weight: 700; background: #f0f3ff; color: #161a30; padding: 12px 16px; border-radius: 8px; }
      .muted { color: #6b7280; font-size: 12px; margin-top: 16px; }
      .footer { padding: 16px 24px; color: #6b7280; font-size: 12px; background: #fafafa; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">Reset your Kampos password</div>
      <div class="content">
        <p>Use the code below to reset your password:</p>
        <p class="code">{{code}}</p>
        <p>This code expires in <strong>{{minutes}}</strong> minutes.</p>
        <p class="muted">If you did not request this, you can safely ignore this email.</p>
      </div>
      <div class="footer">
        &copy; <span id="y">2025</span> Kampos. All rights reserved.
      </div>
    </div>
    <script>document.getElementById('y').innerText = new Date().getFullYear();</script>
  </body>
</html>
